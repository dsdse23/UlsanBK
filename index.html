<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>조식비 정산 및 제출 시스템</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Firebase SDK (데이터 공유를 위해 필수) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />

  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
    .sidebar-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 로그인 화면 -->
  <div id="login-screen" class="fixed inset-0 bg-slate-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl p-8 max-w-md w-full space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 bg-indigo-50 text-indigo-600 rounded-xl mb-1"><i data-lucide="coffee" class="w-8 h-8"></i></div>
        <h2 class="text-2xl font-bold tracking-tight text-slate-900">조식비 정산 관리 포털</h2>
        <p class="text-xs text-slate-400">울산사업팀 복리후생 제출 시스템</p>
      </div>
      <div class="space-y-4">
        <button onclick="handleGuestLogin()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition flex items-center justify-center gap-2">
          <i data-lucide="play-circle" class="w-5 h-5"></i> 울산사업팀 로그인
        </button>
        <div class="relative flex items-center justify-center py-2"><div class="w-full border-t border-slate-200"></div><span class="absolute px-3 bg-white text-[10px] text-slate-400 uppercase">또는</span></div>
        <input id="login-id" type="text" placeholder="아이디" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
        <input id="login-pw" type="password" placeholder="비밀번호" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
        <button onclick="handleLogin()" class="w-full py-2.5 bg-slate-900 text-white font-semibold rounded-xl text-xs transition">로그인</button>
      </div>
    </div>
  </div>

  <!-- 메인 레이아웃 -->
  <div id="app-layout" class="hidden flex min-h-screen">
    <aside id="sidebar" class="sidebar-transition w-64 bg-[#0f172a] text-white flex flex-col fixed inset-y-0 left-0 -translate-x-full md:translate-x-0 z-30">
      <div class="h-16 flex items-center px-6 border-b border-slate-800 font-bold tracking-tight">BREAKFAST <span class="ml-2 text-indigo-400 text-xs">V 1.0</span></div>
      <div class="flex-1 py-6 px-3 space-y-1">
        <button onclick="switchTab('dashboard')" class="menu-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800">대시보드</button>
        <button onclick="switchTab('breakfast')" class="menu-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm bg-indigo-600">조식비 제출</button>
        <button onclick="switchTab('schedule')" id="nav-schedule" class="menu-item hidden w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800">스케줄표</button>
      </div>
      <div class="p-4 border-t border-slate-800">
        <button onclick="handleLogout()" class="w-full py-2 bg-slate-800 rounded-lg text-xs hover:bg-slate-700">로그아웃</button>
      </div>
    </aside>

    <div class="flex-1 flex flex-col md:pl-64 transition-all">
      <header class="h-16 bg-white border-b border-slate-200 flex items-center px-6 justify-between">
        <button onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
        <div id="user-role-badge" class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">울산사업팀</div>
      </header>
      <main id="main-content" class="p-8 space-y-8"></main>
    </div>
  </div>

  <script>
    // [중요] Firebase 연동 설정 (데이터 공유를 위해 여기에 프로젝트 config를 넣으세요)
    const firebaseConfig = {
  apiKey: "AIzaSyDX7uWNQRsQRR-yfAyP-UmXExiHPK-mw3o",
  authDomain: "bkaso-59bbd.firebaseapp.com",
  projectId: "bkaso-59bbd",
  storageBucket: "bkaso-59bbd.firebasestorage.app",
  messagingSenderId: "941553817740",
  appId: "1:941553817740:web:dfcb777d749778b8f243a9"
    };

    if (firebaseConfig.databaseURL) {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      // 여기에 실시간 동기화 및 나머지 로직 추가
    }

    // 탭 이동 및 기본 함수 예시
    function switchTab(tabId) {
      // 페이지 전환 로직
    }
    
    function handleGuestLogin() {
      // 게스트 로그인 로직
      enterApp('user');
    }

    function handleLogin() {
      // 관리자 로그인 로직
      enterApp('admin');
    }

    function enterApp(role) {
      currentUser = { role };
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-layout').classList.remove('hidden');
      switchTab('dashboard');
    }

    function handleLogout() {
      location.reload();
    }
    
    // 엔터키 처리
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        if (!document.getElementById('login-screen').classList.contains('hidden')) handleLogin();
      }
    });

    function showToast(msg, type) {
      console.log(type + ": " + msg);
    }
  </script>
</body>
</html>
